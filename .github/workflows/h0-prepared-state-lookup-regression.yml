# rerun: include exact SCI A2B-remask bridge
name: h0-prepared-state-lookup-regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h0-prepared-state-lookup-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake libeigen3-dev libgmp-dev libssl-dev libomp-dev

      - name: Fetch pinned BOLT dependency
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/cmu-cryptosystems/BOLT.git "$RUNNER_TEMP/BOLT"
          git -C "$RUNNER_TEMP/BOLT" fetch --depth 1 origin 6911b1c26cb0405793e7b5a3e9effe67f659bc49
          git -C "$RUNNER_TEMP/BOLT" checkout --detach 6911b1c26cb0405793e7b5a3e9effe67f659bc49

      - name: Build private M3-M6 regressions
        run: |
          set -euo pipefail
          cmake -S private-research/experiments/243_factored_private_lookup \
            -B "$RUNNER_TEMP/build" \
            -DBOLT_ROOT="$RUNNER_TEMP/BOLT" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++
          cmake --build "$RUNNER_TEMP/build" \
            --target prepared_state_lookup_regression state_key_final_output_regression prepared_state_column_select_regression a2b_remask_bridge_regression \
            --parallel 2

      - name: Run real two-party prepared state lookup
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/build/prepared_state_lookup_regression"
          PORT=39051
          "$BIN" 1 "$PORT" > "$RUNNER_TEMP/alice-lookup.log" 2>&1 &
          APID=$!
          sleep 1
          "$BIN" 2 "$PORT" > "$RUNNER_TEMP/bob-lookup.log" 2>&1
          wait "$APID"
          grep -q "PASS prepared_state_lookup" "$RUNNER_TEMP/alice-lookup.log"
          grep -q "PASS prepared_state_lookup" "$RUNNER_TEMP/bob-lookup.log"

      - name: Run real two-party final M5 lookup into native M6
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/build/state_key_final_output_regression"
          PORT=39061
          "$BIN" 1 "$PORT" > "$RUNNER_TEMP/alice-m6.log" 2>&1 &
          APID=$!
          sleep 1
          "$BIN" 2 "$PORT" > "$RUNNER_TEMP/bob-m6.log" 2>&1
          wait "$APID"
          grep -q "PASS final_state_output_m6" "$RUNNER_TEMP/alice-m6.log"
          grep -q "PASS final_state_output_m6" "$RUNNER_TEMP/bob-m6.log"
          grep -q "mismatches=0" "$RUNNER_TEMP/bob-m6.log"
          cat "$RUNNER_TEMP/alice-m6.log"
          cat "$RUNNER_TEMP/bob-m6.log"

      - name: Run real two-party parallel state-key column OT
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/build/prepared_state_column_select_regression"
          PORT=39071
          "$BIN" 1 "$PORT" > "$RUNNER_TEMP/alice-columns.log" 2>&1 &
          APID=$!
          sleep 1
          "$BIN" 2 "$PORT" > "$RUNNER_TEMP/bob-columns.log" 2>&1
          wait "$APID"
          grep -q "PASS prepared_state_column_select" "$RUNNER_TEMP/alice-columns.log"
          grep -q "PASS prepared_state_column_select" "$RUNNER_TEMP/bob-columns.log"
          cat "$RUNNER_TEMP/alice-columns.log"
          cat "$RUNNER_TEMP/bob-columns.log"

      - name: Run real arithmetic-share to remasked bit-share bridge
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/build/a2b_remask_bridge_regression"
          PORT=39081
          "$BIN" 1 "$PORT" > "$RUNNER_TEMP/alice-a2b.log" 2>&1 &
          APID=$!
          sleep 1
          "$BIN" 2 "$PORT" > "$RUNNER_TEMP/bob-a2b.log" 2>&1
          wait "$APID"
          grep -q "PASS a2b_remask_bridge" "$RUNNER_TEMP/alice-a2b.log"
          grep -q "PASS a2b_remask_bridge" "$RUNNER_TEMP/bob-a2b.log"
          grep -q "mismatches=0" "$RUNNER_TEMP/bob-a2b.log"
          cat "$RUNNER_TEMP/alice-a2b.log"
          cat "$RUNNER_TEMP/bob-a2b.log"

      - name: Run real 16/21-bit arithmetic-share bridge
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/build/a2b_remask_bridge_wide_regression"
          PORT=39091
          "$BIN" 1 "$PORT" > "$RUNNER_TEMP/alice-a2b-wide.log" 2>&1 &
          APID=$!
          sleep 1
          "$BIN" 2 "$PORT" > "$RUNNER_TEMP/bob-a2b-wide.log" 2>&1
          wait "$APID"
          grep -q "PASS a2b_remask_bridge_wide" "$RUNNER_TEMP/alice-a2b-wide.log"
          grep -q "PASS a2b_remask_bridge_wide" "$RUNNER_TEMP/bob-a2b-wide.log"
          grep -q "ell=16" "$RUNNER_TEMP/bob-a2b-wide.log"
          grep -q "ell=21" "$RUNNER_TEMP/bob-a2b-wide.log"
          grep -q "mismatches=0" "$RUNNER_TEMP/bob-a2b-wide.log"
          cat "$RUNNER_TEMP/alice-a2b-wide.log"
          cat "$RUNNER_TEMP/bob-a2b-wide.log"

# temporary scratch workflow: serialized M2 artifact -> prepared real M3-M6
name: h0-prepared-state-lookup-regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h0-prepared-state-lookup-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake libeigen3-dev libgmp-dev libssl-dev libomp-dev

      - name: Verify Python serialized-FSM bridge
        run: |
          set -euo pipefail
          cd private-research
          python -m unittest discover -s tests -p 'test_h0_serialized_fsm.py' -v
          python - <<'PY'
          from tools.h0_m2_preprocess.compiler import DomainSpec, M2Compiler, ModelSpec
          from tools.h0_private_chain.serialized_fsm import build_serialized_fsm
          model = ModelSpec(
              coefficients=((2,1),(-3,1),(1,-2),(1,1)),
              bias=(-4,2,1,-6),
              domain=DomainSpec(lo=(-2,3),bits=(3,3)),
              layer_id="runner-serialized-fsm",
          )
          program=M2Compiler(model).compile()
          artifact=build_serialized_fsm(program,public_width=64)
          digest=artifact.save("/tmp/h0-state-key-plan.bin")
          print("SERIALIZED_FSM",artifact.d,artifact.m,artifact.depth,artifact.width,artifact.artifact_bytes,digest)
          PY

      - name: Fetch pinned BOLT dependency
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/cmu-cryptosystems/BOLT.git "$RUNNER_TEMP/BOLT"
          git -C "$RUNNER_TEMP/BOLT" fetch --depth 1 origin 6911b1c26cb0405793e7b5a3e9effe67f659bc49
          git -C "$RUNNER_TEMP/BOLT" checkout --detach 6911b1c26cb0405793e7b5a3e9effe67f659bc49

      - name: Build private serialized M2-M6 regression
        run: |
          set -euo pipefail
          cmake -S private-research/experiments/243_factored_private_lookup \
            -B "$RUNNER_TEMP/build" \
            -DBOLT_ROOT="$RUNNER_TEMP/BOLT" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++
          cmake --build "$RUNNER_TEMP/build" \
            --target state_key_serialized_plan_regression state_key_bit_bridge_scale state_key_bit_bridge_prepared_scale \
            --parallel 2

      - name: Run Python-artifact to real two-party M3-M6
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/build/state_key_serialized_plan_regression"
          PORT=39131
          "$BIN" 1 "$PORT" /tmp/h0-state-key-plan.bin > "$RUNNER_TEMP/alice-serialized.log" 2>&1 &
          APID=$!
          sleep 1
          "$BIN" 2 "$PORT" - > "$RUNNER_TEMP/bob-serialized.log" 2>&1
          wait "$APID"
          grep -q "PASS state_key_serialized_plan" "$RUNNER_TEMP/alice-serialized.log"
          grep -q "PASS state_key_serialized_plan" "$RUNNER_TEMP/bob-serialized.log"
          grep -q "mismatches=0" "$RUNNER_TEMP/bob-serialized.log"
          cat "$RUNNER_TEMP/alice-serialized.log"
          cat "$RUNNER_TEMP/bob-serialized.log"

      - name: Recheck target-volume bit bridge
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/build/state_key_bit_bridge_scale"
          PORT=39141
          "$BIN" 1 "$PORT" > "$RUNNER_TEMP/alice-scale.log" 2>&1 &
          APID=$!
          sleep 1
          "$BIN" 2 "$PORT" > "$RUNNER_TEMP/bob-scale.log" 2>&1
          wait "$APID"
          grep -q "PASS state_key_bit_bridge_scale" "$RUNNER_TEMP/alice-scale.log"
          grep -q "schedule_bits=12288" "$RUNNER_TEMP/bob-scale.log"
          grep -q "mismatches=0" "$RUNNER_TEMP/bob-scale.log"
          cat "$RUNNER_TEMP/alice-scale.log"
          cat "$RUNNER_TEMP/bob-scale.log"


      - name: Benchmark prepared parallel-prefix 768x16 bridge
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/build/state_key_bit_bridge_prepared_scale"
          PORT=39151
          "$BIN" 1 "$PORT" > "$RUNNER_TEMP/alice-prepared-scale.log" 2>&1 &
          APID=$!
          sleep 1
          "$BIN" 2 "$PORT" > "$RUNNER_TEMP/bob-prepared-scale.log" 2>&1
          wait "$APID"
          grep -q "PASS state_key_bit_bridge_prepared_scale" "$RUNNER_TEMP/alice-prepared-scale.log"
          grep -q "schedule_bits=12288" "$RUNNER_TEMP/bob-prepared-scale.log"
          grep -q "mismatches=0" "$RUNNER_TEMP/bob-prepared-scale.log"
          cat "$RUNNER_TEMP/alice-prepared-scale.log"
          cat "$RUNNER_TEMP/bob-prepared-scale.log"

name: scratch two-route OPT query-tree screen

on:
  push:
    paths:
      - .github/workflows/scratch-two-route-query-tree.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private research source at frozen commit
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          ref: f46c7423192b2f2d34a10d573fa79db9c0f15918
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 \
            torch==2.5.1 \
            transformers==4.46.3 \
            datasets==3.1.0 \
            accelerate==1.1.1 \
            huggingface_hub==0.26.5

      - name: Run both routes on reserved fresh real contexts
        env:
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python -m py_compile private-research/experiments/two_route_relu_tree_screen.py
          set +e
          python private-research/experiments/two_route_relu_tree_screen.py \
            --reservation private-research/results/relu_query_tree_routes/sample_reservation_20260923.json \
            --out "$RUNNER_TEMP/two-route-summary.json" \
            > "$RUNNER_TEMP/two-route-stdout.json" \
            2> "$RUNNER_TEMP/two-route-stderr.log"
          run_status=$?
          set -e
          if [ "$run_status" -ne 0 ]; then
            printf '{"schema":"OPT_TWO_ROUTE_QUERY_TREE_SCREEN_V1","status":"failed","exit_code":%s}\n' "$run_status" > "$RUNNER_TEMP/two-route-summary.json"
          fi
          test -s "$RUNNER_TEMP/two-route-summary.json"

      - name: Upload sanitized aggregate only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-route-tree-screen-${{ github.run_id }}
          path: ${{ runner.temp }}/two-route-summary.json
          if-no-files-found: error
          retention-days: 1

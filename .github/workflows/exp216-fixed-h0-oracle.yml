name: exp216-fixed-h0-oracle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp216-fixed-h0-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exp216:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          persist-credentials: false

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          python -m pip install numpy scipy datasets "transformers>=4.45,<5" >/dev/null
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu >/dev/null

      - name: Exact oracle regression
        shell: bash
        run: |
          set -euo pipefail
          cd private-research
          mkdir -p results
          python tests/test_exp216_milp_oracle.py > results/216_milp_regression_stdout.txt 2>&1

      - name: Recreate clean OPT sign pool
        shell: bash
        run: |
          set -euo pipefail
          cd private-research
          python experiments/215_collect_clean_opt_sign_pool.py             --layer 6             --n-build 8192             --n-eval 1024             --build-stream-tokens 32768             --eval-stream-tokens 8192             --out results/216_clean_sign_pool.json             > results/216_clean_sign_pool_stdout.txt 2>&1

      - name: Run fixed-H0 exact and cheating oracle
        shell: bash
        run: |
          set +e
          cd private-research
          python experiments/216_fixed_h0_mask_oracle.py             --layer 6             --n-build 8192             --n-eval 1024             --h0-row 7             --budget 461             --milp-seconds 120             --max-cheat-masks 256             --seed-trials 12             --out results/216_fixed_h0_oracle.json             > results/216_fixed_h0_oracle_stdout.txt 2>&1
          status=$?
          echo "$status" > results/216_runner_exit_code.txt
          exit 0

      - name: Upload short-lived result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp216-result
          path: |
            private-research/results/216_milp_regression_stdout.txt
            private-research/results/216_clean_sign_pool.json
            private-research/results/216_clean_sign_pool_stdout.txt
            private-research/results/216_fixed_h0_oracle.json
            private-research/results/216_fixed_h0_oracle_stdout.txt
            private-research/results/216_runner_exit_code.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Reflect experiment exit status
        shell: bash
        run: |
          code="$(cat private-research/results/216_runner_exit_code.txt)"
          test "$code" = "0"

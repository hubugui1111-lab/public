name: h0-opt-exact-transverse-680

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h0-opt-exact-transverse-680.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
      - name: Install exact-certificate dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check \
            torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check \
            numpy==2.1.3 scipy==1.14.1 transformers==4.56.2 \
            huggingface-hub==0.34.4 safetensors==0.6.2 python-flint==0.9.0
      - name: Build exact 680-hyperplane certificate
        run: |
          set -euo pipefail
          cd private-research
          "$RUNNER_TEMP/venv/bin/python" -m tools.opt_exact_transverse_gate \
            --k 680 --family distance --trial 0 \
            --out "$RUNNER_TEMP/opt-exact-transverse-680.json"

name: h0-point-location-structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h0-point-location-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
      - name: Test exact structure audit
        run: |
          set -euo pipefail
          cd private-research
          python -m unittest discover -s tests -p 'test_h0_structure_audit.py' -v
      - name: Audit saved real affine layer
        run: |
          set -euo pipefail
          cd private-research
          python -m tools.local_point_location_structure_gate

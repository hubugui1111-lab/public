# TEMPLATE ONLY: ephemeral public compute, never publish private source or logs.
name: h0-revision-compare-audit

on:
  workflow_dispatch:
    inputs:
      private_ref:
        description: Immutable controller SHA containing the common verifier
        required: true
        type: string
      revision_a:
        description: Immutable private revision A (default OT24)
        required: true
        default: 1ddbc02f9bd2657ca6e1b5dadd5b96551c361082
        type: string
      revision_b:
        description: Immutable private revision B (default OT64)
        required: true
        default: c726fffe018f922e8bfc8757dab322e6a8617198
        type: string

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        workload: [hit, fallback]
    env:
      CONTROLLER_SHA: ${{ inputs.private_ref }}
      REVISION_A_SHA: ${{ inputs.revision_a }}
      REVISION_B_SHA: ${{ inputs.revision_b }}
      AUDIT_WORKLOAD: ${{ matrix.workload }}
    steps:
      - name: Validate immutable references and initialize private scratch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$REVISION_A_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$REVISION_B_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$REVISION_A_SHA" != "$REVISION_B_SHA" ]] || exit 2
          [[ "$AUDIT_WORKLOAD" = hit || "$AUDIT_WORKLOAD" = fallback ]] || exit 2
          TASK_DIR="$RUNNER_TEMP/h0-revision-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"
          umask 077
          mkdir -p "$TASK_DIR"
          printf '{"schema_version":1,"pass":false,"stage":"not_run"}\n' > "$TASK_DIR/summary.json"

      - name: Checkout common verifier read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hubugui1111-lab/tda-ppml-research
          ref: ${{ inputs.private_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-controller
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Checkout revision A read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hubugui1111-lab/tda-ppml-research
          ref: ${{ inputs.revision_a }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-revision-a
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Checkout revision B read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hubugui1111-lab/tda-ppml-research
          ref: ${{ inputs.revision_b }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-revision-b
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify all checkouts and install shared dependencies quietly
        shell: bash
        run: |
          set -euo pipefail
          if ! {
            test "$(git -C private-controller rev-parse HEAD)" = "$CONTROLLER_SHA" &&
            test "$(git -C private-revision-a rev-parse HEAD)" = "$REVISION_A_SHA" &&
            test "$(git -C private-revision-b rev-parse HEAD)" = "$REVISION_B_SHA";
          } > "$TASK_DIR/checkout-check.log" 2>&1; then
            printf '{"schema_version":1,"pass":false,"stage":"checkout_mismatch"}\n' > "$TASK_DIR/summary.json"
            exit 1
          fi
          if ! {
            sudo apt-get update -qq &&
            sudo apt-get install -y -qq clang libeigen3-dev libgmp-dev libssl-dev libomp-dev python3-venv &&
            python3 -m venv "$TASK_DIR/venv" &&
            "$TASK_DIR/venv/bin/python" -m pip install --disable-pip-version-check numpy==2.1.3 pytest==8.3.5
          } > "$TASK_DIR/dependencies.log" 2>&1; then
            printf '{"schema_version":1,"pass":false,"stage":"dependencies_failed"}\n' > "$TASK_DIR/summary.json"
            exit 1
          fi

      - name: Fetch one shared pair of pinned upstream checkouts quietly
        shell: bash
        run: |
          set -euo pipefail
          if ! {
            git clone --filter=blob:none https://github.com/mpc-msri/EzPC.git "$TASK_DIR/EzPC" &&
            git -C "$TASK_DIR/EzPC" checkout --detach f24bf3e022dde3493cf0ffe3ebd92dd73936b734 &&
            test "$(git -C "$TASK_DIR/EzPC" rev-parse HEAD)" = f24bf3e022dde3493cf0ffe3ebd92dd73936b734 &&
            git clone --filter=blob:none https://github.com/xingpz2008/dealerless-FSS_public.git "$TASK_DIR/dealerless-fss" &&
            git -C "$TASK_DIR/dealerless-fss" checkout --detach e8fefb537253ee5b0317ea484c934656f09a66f5 &&
            test "$(git -C "$TASK_DIR/dealerless-fss" rev-parse HEAD)" = e8fefb537253ee5b0317ea484c934656f09a66f5
          } > "$TASK_DIR/fetch.log" 2>&1; then
            printf '{"schema_version":1,"pass":false,"stage":"fetch_failed"}\n' > "$TASK_DIR/summary.json"
            exit 1
          fi

      - name: Build both revisions with identical toolchain and flags quietly
        shell: bash
        run: |
          set -euo pipefail
          for revision in a b; do
            if ! {
              cmake -S "private-revision-$revision/experiments/230_h0_dealerless_adapter" \
                -B "$TASK_DIR/build-$revision" \
                -DDEALERLESS_FSS_ROOT="$TASK_DIR/dealerless-fss" \
                -DEZPC_ROOT="$TASK_DIR/EzPC" \
                -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
                -DCMAKE_PREFIX_PATH=/usr/lib/x86_64-linux-gnu/cmake/eigen3 \
                -DCMAKE_BUILD_TYPE=Release \
                -DDEALERLESS_BUILD_TESTS=OFF &&
              cmake --build "$TASK_DIR/build-$revision" --target h0_dealerless_adapter --parallel 2;
            } > "$TASK_DIR/build-$revision.log" 2>&1; then
              "$TASK_DIR/venv/bin/python" private-controller/scripts/summarize_h0_build_failure.py \
                "$TASK_DIR/build-$revision.log" "$TASK_DIR/summary.json"
              exit 1
            fi
          done

      - name: Compare both revisions using one fixed verifier quietly
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          "$TASK_DIR/venv/bin/python" private-controller/scripts/run_h0_revision_compare_audit.py \
            --binary-a "$TASK_DIR/build-a/h0_dealerless_adapter" \
            --binary-b "$TASK_DIR/build-b/h0_dealerless_adapter" \
            --revision-a-sha "$REVISION_A_SHA" \
            --revision-b-sha "$REVISION_B_SHA" \
            --controller-sha "$CONTROLLER_SHA" \
            --compiler-binary /usr/bin/clang++ \
            --workload "$AUDIT_WORKLOAD" \
            --report "$TASK_DIR/summary.json" \
            --timeout 3600 \
            > "$TASK_DIR/driver.log" 2>&1

      # Only allowlisted aggregate JSON leaves private scratch. No party inputs,
      # outputs, shares, research source, compiler output or driver logs upload.
      - name: Upload short-lived sanitized comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h0-revision-${{ matrix.workload }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TASK_DIR }}/summary.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove all private checkouts, builds and scratch logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Check every absolute target before any recursive removal.
          [[ "$GITHUB_WORKSPACE" = /* && "$GITHUB_WORKSPACE" != / ]] || exit 2
          [[ "$RUNNER_TEMP" = /* && "$RUNNER_TEMP" != / ]] || exit 2
          if [[ -n "${TASK_DIR:-}" ]]; then
            [[ "$TASK_DIR" = "$RUNNER_TEMP/h0-revision-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ]] || exit 2
            rm -rf -- "$TASK_DIR"
          fi
          rm -rf -- "$GITHUB_WORKSPACE/private-controller" \
            "$GITHUB_WORKSPACE/private-revision-a" "$GITHUB_WORKSPACE/private-revision-b"

# Controller: inspect both matrix summaries, delete the public artifacts and
# run logs after backup/inspection, then remove the temporary public workflow.

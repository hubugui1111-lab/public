# TEMPLATE ONLY: install temporarily in the public compute repository.
# Offline real-data diagnostic only; no online global-permutation protocol.
name: h0-prefix-coverage-audit

on:
  workflow_dispatch:
    inputs:
      private_ref:
        description: Full audited private TDA commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TDA_COMMIT: ${{ inputs.private_ref }}
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HF_DATASETS_DISABLE_PROGRESS_BARS: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - name: Validate immutable source reference
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TDA_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 2
          TASK_DIR="$RUNNER_TEMP/h0-prefix-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"
          echo "HF_HOME=$TASK_DIR/huggingface" >> "$GITHUB_ENV"
          echo "HF_HUB_CACHE=$TASK_DIR/huggingface/hub" >> "$GITHUB_ENV"
          echo "HF_DATASETS_CACHE=$TASK_DIR/huggingface/datasets" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$TASK_DIR/pip-cache" >> "$GITHUB_ENV"
          umask 077
          mkdir -p "$TASK_DIR"
          printf '{"schema_version":1,"pass":false,"stage":"not_run"}\n' > "$TASK_DIR/summary.json"

      - name: Checkout private TDA source read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hubugui1111-lab/tda-ppml-research
          ref: ${{ inputs.private_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify checkout and install pinned CPU dependencies quietly
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-research rev-parse HEAD)" = "$TDA_COMMIT"
          # These are new pins: historical exp215 did not record exact versions.
          # Primary metadata: https://pypi.org/pypi/{package}/{version}/json
          # Official CPU index: https://pytorch.org/get-started/previous-versions/
          if ! {
            sudo apt-get update -qq &&
            sudo apt-get install -y -qq python3-venv &&
            python3 -m venv "$TASK_DIR/venv" &&
            "$TASK_DIR/venv/bin/python" -m pip install --disable-pip-version-check \
              torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu &&
            "$TASK_DIR/venv/bin/python" -m pip install --disable-pip-version-check \
              numpy==2.1.3 transformers==4.56.2 datasets==4.1.1 \
              tokenizers==0.22.0 huggingface-hub==0.34.4 pyarrow==21.0.0 \
              safetensors==0.6.2 fsspec==2025.9.0 &&
            "$TASK_DIR/venv/bin/python" -m pip check
          } > "$TASK_DIR/dependencies.log" 2>&1; then
            printf '{"schema_version":1,"pass":false,"stage":"dependencies_failed"}\n' > "$TASK_DIR/summary.json"
            exit 1
          fi

      - name: Collect frozen real pools and evaluate BUILD-selected groups quietly
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          "$TASK_DIR/venv/bin/python" private-research/scripts/run_h0_prefix_coverage_audit.py \
            --report "$TASK_DIR/summary.json" \
            --source-sha "$TDA_COMMIT" \
            > "$TASK_DIR/driver.log" 2>&1

      # Never upload logs, model/data caches, selected coordinates, sign patterns,
      # hidden states, or private source. This single JSON is explicitly allowlisted.
      - name: Upload short-lived aggregate diagnostic
        if: ${{ always() && env.TASK_DIR != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h0-prefix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TASK_DIR }}/summary.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove raw caches and private checkout
        if: ${{ always() && env.TASK_DIR != '' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TASK_DIR" in "$RUNNER_TEMP"/h0-prefix-*) ;; *) exit 2 ;; esac
          rm -rf -- "$TASK_DIR" "$GITHUB_WORKSPACE/private-research"

# Controller: inspect summary/exit status, then delete the artifact, run logs,
# and temporary public workflow. Scratch aggregates are not paper-grade data.

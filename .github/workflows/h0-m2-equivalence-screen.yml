name: h0-m2-equivalence-screen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h0-m2-equivalence-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
      - name: Verify equivalence logic
        run: |
          set -euo pipefail
          cd private-research
          python -m unittest discover -s tests -p 'test_h0_equivalence_profile.py' -v
      - name: Profile exact tail equivalence on real 8-filter frontier
        run: |
          set -euo pipefail
          cd private-research
          python - <<'PY'
          from collections import Counter
          from tools.h0_m2_preprocess.model import ModelSpec, CompileLimitExceeded
          from tools.h0_m2_preprocess.scheduled_compiler import ScheduledM2Compiler
          from tools.h0_m2_preprocess.schedules import axis_major_msb
          from tools.h0_m2_preprocess.equivalence_profile import lookahead_signature_classes
          model=ModelSpec.load("results/local_real_model/exact_patch_model.json")
          sched=axis_major_msb(model.domain)
          compiler=ScheduledM2Compiler(model,sched,max_states=65536)
          try:
              compiler.compile()
          except CompileLimitExceeded:
              pass
          widths=Counter(s.depth for s in compiler.states)
          for cutoff in (192,196):
              print("PREFIX_COUNT",cutoff,sum(v for d,v in widths.items() if d < cutoff),flush=True)
          for k in (4,8):
              d=len(sched)-k
              print("TAIL_WIDTH",k,d,widths[d],flush=True)
              r=lookahead_signature_classes(model,sched,compiler.states,depth=d,lookahead_bits=k)
              print("TAIL_EQUIV",k,r.raw_states,r.signature_classes,
                    round(r.class_ratio,6),r.largest_class,flush=True)
          PY

name: h0-m2-equivalence-screen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h0-m2-equivalence-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
      - name: Verify equivalence lower-bound logic
        run: |
          set -euo pipefail
          cd private-research
          python -m unittest discover -s tests -p 'test_h0_equivalence_profile.py' -v
      - name: Profile real 8-filter frontier
        run: |
          set -euo pipefail
          cd private-research
          python -m tools.local_equivalence_gate --cap 65536 --out "$RUNNER_TEMP/equiv.json"

# TEMPLATE ONLY — copy temporarily into hubugui1111-lab/public/.github/workflows/
name: h0-dealerless-adapter-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout public scratch repo
        uses: actions/checkout@v4

      - name: Checkout private TDA source read-only
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false

      - name: Install native dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeigen3-dev libgmp-dev libssl-dev libomp-dev

      - name: Fetch pinned published FSS implementation
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mpc-msri/EzPC.git /tmp/EzPC
          git -C /tmp/EzPC checkout f24bf3e022dde3493cf0ffe3ebd92dd73936b734
          git clone --filter=blob:none https://github.com/xingpz2008/dealerless-FSS_public.git /tmp/dealerless-fss
          git -C /tmp/dealerless-fss checkout e8fefb537253ee5b0317ea484c934656f09a66f5

      - name: Build adapter
        run: |
          set -euo pipefail
          cmake -S private-research/experiments/230_h0_dealerless_adapter \
            -B /tmp/h0-adapter-build \
            -DDEALERLESS_FSS_ROOT=/tmp/dealerless-fss \
            -DCMAKE_PREFIX_PATH=/usr/lib/x86_64-linux-gnu/cmake/eigen3 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDEALERLESS_BUILD_TESTS=OFF
          cmake --build /tmp/h0-adapter-build --parallel 2

      - name: Run two-party smoke quietly
        shell: bash
        run: |
          set +e
          mkdir -p private-research/results
          /tmp/h0-adapter-build/h0_dealerless_adapter r=2 p=32991 \
            >private-research/results/230_server.txt 2>&1 &
          server_pid=$!
          sleep 2
          /tmp/h0-adapter-build/h0_dealerless_adapter r=3 p=32991 \
            >private-research/results/230_client.txt 2>&1
          client_status=$?
          wait "$server_pid"
          server_status=$?
          printf '{"server_exit":%s,"client_exit":%s}\n' \
            "$server_status" "$client_status" \
            >private-research/results/230_status.json
          test "$server_status" = 0
          test "$client_status" = 0

      - name: Upload short-lived result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h0-dealerless-adapter-${{ github.run_id }}
          path: |
            private-research/results/230_server.txt
            private-research/results/230_client.txt
            private-research/results/230_status.json
          if-no-files-found: error
          retention-days: 1

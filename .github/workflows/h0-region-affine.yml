# TEMPLATE ONLY: private source, ephemeral standard Runner, aggregate output only.
name: h0-region-affine-module-audit
on:
  workflow_dispatch:
    inputs:
      private_ref:
        description: Full immutable private source and verifier SHA
        required: true
        type: string
      features:
        description: Public module shape; run 8 before 3072
        required: true
        default: '8'
        type: choice
        options: ['8', '3072']
      trials:
        description: Retained trials without discarded warmup
        required: true
        default: '1'
        type: choice
        options: ['1', '3']
permissions:
  contents: read
jobs:
  module:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TDA_COMMIT: ${{ inputs.private_ref }}
      FEATURES: ${{ inputs.features }}
      TRIALS: ${{ inputs.trials }}
    steps:
      - name: Validate immutable source and public dimensions
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TDA_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$FEATURES" = 8 || "$FEATURES" = 3072 ]] || exit 2
          [[ "$TRIALS" = 1 || "$TRIALS" = 3 ]] || exit 2
          TASK_DIR="$RUNNER_TEMP/h0-region-affine-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"
          umask 077
          mkdir -p "$TASK_DIR"
          printf '{"schema_version":1,"pass":false,"stage":"not_run"}\n' > "$TASK_DIR/summary.json"
      - name: Checkout private source read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hubugui1111-lab/tda-ppml-research
          ref: ${{ inputs.private_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Verify checkout and install dependencies quietly
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-research rev-parse HEAD)" = "$TDA_COMMIT"
          if ! {
            sudo apt-get update -qq &&
            sudo apt-get install -y -qq clang libeigen3-dev libgmp-dev libssl-dev libomp-dev python3-venv &&
            python3 -m venv "$TASK_DIR/venv" &&
            "$TASK_DIR/venv/bin/python" -m pip install --disable-pip-version-check numpy==2.1.3 pytest==8.3.5;
          } > "$TASK_DIR/dependencies.log" 2>&1; then
            printf '{"schema_version":1,"pass":false,"stage":"dependencies_failed"}\n' > "$TASK_DIR/summary.json"
            exit 1
          fi
      - name: Fetch pinned implementations quietly
        shell: bash
        run: |
          set -euo pipefail
          if ! {
            git clone --filter=blob:none https://github.com/mpc-msri/EzPC.git "$TASK_DIR/EzPC" &&
            git -C "$TASK_DIR/EzPC" checkout --detach f24bf3e022dde3493cf0ffe3ebd92dd73936b734 &&
            test "$(git -C "$TASK_DIR/EzPC" rev-parse HEAD)" = f24bf3e022dde3493cf0ffe3ebd92dd73936b734 &&
            git clone --filter=blob:none https://github.com/xingpz2008/dealerless-FSS_public.git "$TASK_DIR/dealerless-fss" &&
            git -C "$TASK_DIR/dealerless-fss" checkout --detach e8fefb537253ee5b0317ea484c934656f09a66f5 &&
            test "$(git -C "$TASK_DIR/dealerless-fss" rev-parse HEAD)" = e8fefb537253ee5b0317ea484c934656f09a66f5;
          } > "$TASK_DIR/fetch.log" 2>&1; then
            printf '{"schema_version":1,"pass":false,"stage":"fetch_failed"}\n' > "$TASK_DIR/summary.json"
            exit 1
          fi
      - name: Build conditional region module and required helpers quietly
        shell: bash
        run: |
          set -euo pipefail
          if ! {
            cmake -S private-research/experiments/230_h0_dealerless_adapter -B "$TASK_DIR/build" \
              -DDEALERLESS_FSS_ROOT="$TASK_DIR/dealerless-fss" -DEZPC_ROOT="$TASK_DIR/EzPC" \
              -DCMAKE_CXX_COMPILER=/usr/bin/clang++ -DCMAKE_PREFIX_PATH=/usr/lib/x86_64-linux-gnu/cmake/eigen3 \
              -DCMAKE_BUILD_TYPE=Release -DDEALERLESS_BUILD_TESTS=OFF &&
            cmake --build "$TASK_DIR/build" --target h0_region_affine_trial --parallel 2;
          } > "$TASK_DIR/build.log" 2>&1; then
            "$TASK_DIR/venv/bin/python" private-research/scripts/summarize_h0_build_failure.py \
              "$TASK_DIR/build.log" "$TASK_DIR/summary.json"
            exit 1
          fi
      - name: Verify two-party conditional module quietly
        shell: bash
        run: |
          set -euo pipefail
          "$TASK_DIR/venv/bin/python" private-research/scripts/run_h0_region_affine_audit.py \
            --binary "$TASK_DIR/build/h0_region_affine_trial" --report "$TASK_DIR/summary.json" \
            --source-sha "$TDA_COMMIT" --f "$FEATURES" --trials "$TRIALS" --timeout 600 \
            > "$TASK_DIR/driver.log" 2>&1
      - name: Upload short-lived aggregate summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h0-region-affine-${{ inputs.features }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TASK_DIR }}/summary.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove private data from runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "$TASK_DIR" in "$RUNNER_TEMP"/h0-region-affine-*) ;; *) exit 2 ;; esac
          rm -rf -- "$TASK_DIR" "$GITHUB_WORKSPACE/private-research"

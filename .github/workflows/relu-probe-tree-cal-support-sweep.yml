name: relu-probe-tree-cal-support-sweep

on:
  push:
    paths:
      - '.github/workflows/relu-probe-tree-cal-support-sweep.yml'

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      TDA_COMMIT: e118e96effd706d5a7ffc030aabec465c1d27fba
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Initialize scratch
        shell: bash
        run: |
          set -euo pipefail
          TASK_DIR="$RUNNER_TEMP/relu-probe-tree-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"
          echo "HF_HOME=$TASK_DIR/huggingface" >> "$GITHUB_ENV"
          mkdir -p "$TASK_DIR"

      - name: Checkout pinned private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hubugui1111-lab/tda-ppml-research
          ref: ${{ env.TDA_COMMIT }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          persist-credentials: false
          fetch-depth: 1
          submodules: false

      - name: Install pinned CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$TASK_DIR/venv"
          "$TASK_DIR/venv/bin/python" -m pip install --disable-pip-version-check             torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          "$TASK_DIR/venv/bin/python" -m pip install --disable-pip-version-check             numpy==2.1.3 transformers==4.56.2 tokenizers==0.22.0             huggingface-hub==0.34.4 datasets==3.6.0 pyarrow==21.0.0 safetensors==0.6.2
          "$TASK_DIR/venv/bin/python" -m pip check

      - name: Compile and run sweep
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=private-research/experiments/153c_relu_probe_tree_cal_support_sweep.py
          "$TASK_DIR/venv/bin/python" -m py_compile "$SCRIPT"
          "$TASK_DIR/venv/bin/python" "$SCRIPT"             --source-sha "$TDA_COMMIT"             --n-fit 1024 --n-cal 1024 --n-test 512             --min-leaf 32 --layer 0 --max-depth 2             --out "$TASK_DIR/summary.json" | tee "$TASK_DIR/compact.log"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: relu-probe-tree-cal-support-${{ github.run_id }}
          path: |
            ${{ env.TASK_DIR }}/summary.json
            ${{ env.TASK_DIR }}/compact.log
          retention-days: 1
          if-no-files-found: error

name: h0-affine-image-cell-audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h0-affine-image-cell-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact affine-image algebra
        run: |
          set -euo pipefail
          cd private-research
          python -m unittest discover -s tests -p 'test_h0_affine_image.py' -v
      - name: Install MILP solver binding
        run: python -m pip install --disable-pip-version-check scipy
      - name: Enumerate exact integer sign-cell witnesses
        run: |
          set -euo pipefail
          cd private-research
          python -m tools.local_affine_image_gate \
            --out "$RUNNER_TEMP/affine-image.json"

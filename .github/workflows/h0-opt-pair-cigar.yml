name: h0-opt-pair-cigar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h0-opt-pair-cigar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cigar:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "transformers==4.56.2" "torch" "numpy" "huggingface_hub"
      - name: Measure direction-specific safe ellipsoids
        run: |
          set -euo pipefail
          cd private-research
          python -m tools.opt_h0_pair_cigar_frontier             --budget 300 --budget 680             --major-factor 0.5 --major-factor 0.75 --major-factor 1.0

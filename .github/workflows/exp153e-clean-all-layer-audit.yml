name: exp153e-clean-all-layer-audit
on:
  push:
    paths:
      - ".github/workflows/exp153e-clean-all-layer-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      TDA_COMMIT: aa0ab91e23b6bfd8eeabc05b6ec07e9ec8c35a75
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Initialize isolated scratch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TDA_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 2
          TASK_DIR="$RUNNER_TEMP/exp153e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"
          echo "HF_HOME=$TASK_DIR/huggingface" >> "$GITHUB_ENV"
          umask 077
          mkdir -p "$TASK_DIR"
          printf '{"status":"not_run"}\n' > "$TASK_DIR/summary.json"
      - name: Checkout pinned private source read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hubugui1111-lab/tda-ppml-research
          ref: ${{ env.TDA_COMMIT }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Install pinned CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-research rev-parse HEAD)" = "$TDA_COMMIT"
          python3 -m venv "$TASK_DIR/venv"
          "$TASK_DIR/venv/bin/python" -m pip install --disable-pip-version-check \
            torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          "$TASK_DIR/venv/bin/python" -m pip install --disable-pip-version-check \
            numpy==2.1.3 transformers==4.56.2 tokenizers==0.22.0 \
            huggingface-hub==0.34.4 datasets==3.6.0 pyarrow==21.0.0 safetensors==0.6.2
          "$TASK_DIR/venv/bin/python" -m pip check
      - name: Run fresh all-layer audit
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=private-research/experiments/153e_relu_probe_tree_fresh_all_layer.py
          for FILE in \
            results/exp153b_relu_probe_tree_random_test.json \
            results/exp153c_relu_probe_tree_cal_support_sweep.json \
            results/exp153d_relu_probe_tree_low_cal_crossing.json \
            results/exp153c_all_layer_independent_text_audit.json; do
            test -s "private-research/$FILE"
          done
          "$TASK_DIR/venv/bin/python" -m py_compile "$SCRIPT"
          "$TASK_DIR/venv/bin/python" "$SCRIPT" \
            --source-sha "$TDA_COMMIT" --n-fit 2048 --n-cal 1024 --n-test 1024 \
            --min-leaf 32 --min-cal-occ 16 --out "$TASK_DIR/summary.json" \
            2>&1 | tee "$TASK_DIR/driver.log"
      - name: Upload aggregate result only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exp153e-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TASK_DIR }}/summary.json
          retention-days: 1
          if-no-files-found: error
      - name: Remove private scratch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "$TASK_DIR" in "$RUNNER_TEMP"/exp153e-*) ;; *) exit 2 ;; esac
          rm -rf -- "$TASK_DIR" "$GITHUB_WORKSPACE/private-research"

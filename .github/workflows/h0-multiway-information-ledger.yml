name: h0-multiway-information-ledger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h0-multiway-information-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
      - name: Verify information ledger
        run: |
          set -euo pipefail
          cd private-research
          python -m unittest discover -s tests -p 'test_h0_multiway_information.py' -v

name: private-exp207-runner

on:
  push:
    branches: [main]
    paths:
      - 'trigger-exp207'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exp207:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout scratch repo
        uses: actions/checkout@v4

      - name: Checkout private research repo
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.private }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          python -m pip install numpy "transformers>=4.45,<5" sentencepiece >/dev/null
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu >/dev/null

      - name: Run private experiment quietly
        shell: bash
        run: |
          set +e
          cd private-research
          mkdir -p results
          python experiments/207_t5tiny_central_cutting_smoke.py > results/207_t5tiny_central_cutting_stdout.txt 2>&1
          status=$?
          echo "$status" > results/207_runner_exit_code.txt
          exit 0

      - name: Upload short-lived result artifact
        uses: actions/upload-artifact@v4
        with:
          name: exp207-result
          path: |
            private-research/results/207_t5tiny_central_cutting.json
            private-research/results/207_t5tiny_central_cutting_stdout.txt
            private-research/results/207_runner_exit_code.txt
          if-no-files-found: error
          retention-days: 1

      - name: Reflect experiment exit status
        shell: bash
        run: |
          code="$(cat private-research/results/207_runner_exit_code.txt)"
          test "$code" = "0"

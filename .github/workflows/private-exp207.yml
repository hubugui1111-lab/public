# Canonical public-runner pattern. Research code stays private.
name: private-exp210-runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-exp207.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exp210:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout scratch repo
        uses: actions/checkout@v4

      - name: Checkout private research repo
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 0
          persist-credentials: true

      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          python -m pip install numpy "transformers>=4.45,<5" sentencepiece >/dev/null
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu >/dev/null

      - name: Run private experiment quietly
        shell: bash
        run: |
          set +e
          cd private-research
          mkdir -p results
          python experiments/210_t5tiny_h0_template_library.py > results/210_t5tiny_h0_template_library_stdout.txt 2>&1
          status=$?
          echo "$status" > results/210_runner_exit_code.txt
          exit 0

      - name: Commit result back to private repo
        shell: bash
        run: |
          set -euo pipefail
          cd private-research
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/210_t5tiny_h0_template_library_stdout.txt results/210_runner_exit_code.txt
          test ! -f results/210_t5tiny_h0_template_library.json || git add results/210_t5tiny_h0_template_library.json
          if ! git diff --cached --quiet; then
            git commit -m "exp210: record public-runner H0 library result"
            git push origin HEAD:main
          fi

      - name: Upload backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp210-result-${{ github.run_id }}
          path: |
            private-research/results/210_t5tiny_h0_template_library.json
            private-research/results/210_t5tiny_h0_template_library_stdout.txt
            private-research/results/210_runner_exit_code.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Reflect experiment exit status
        shell: bash
        run: |
          code="$(cat private-research/results/210_runner_exit_code.txt)"
          test "$code" = "0"

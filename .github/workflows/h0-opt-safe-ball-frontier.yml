name: h0-opt-safe-ball-frontier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h0-opt-safe-ball-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "transformers==4.56.2" "torch" "numpy" "huggingface_hub"
      - name: Measure strict H0 safe-ball coverage frontier
        run: |
          set -euo pipefail
          cd private-research
          python -m tools.opt_h0_safe_ball_frontier             --budget 300 --budget 400 --budget 500 --budget 600             --budget 680 --budget 768 --budget 900 --budget 1024

name: exp223-dynamic-threshold-balltree

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp223.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exp223:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: d83c3ea375b8b81a208e8d63f9c9f5cdfae293a8
          path: private-research
          fetch-depth: 1
          persist-credentials: false

      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          python -m pip install numpy >/dev/null
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu >/dev/null

      - name: Download public OPT-125M release
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 -o /tmp/opt-125m.tar.gz             https://github.com/LMCache/opt-125m/releases/download/v1.0/opt-125m.tar.gz
          mkdir -p /tmp/opt125
          tar -xzf /tmp/opt-125m.tar.gz -C /tmp/opt125
          MODEL_BIN="$(find /tmp/opt125 -name pytorch_model.bin -type f | head -1)"
          test -n "$MODEL_BIN"
          echo "MODEL_BIN=$MODEL_BIN" >> "$GITHUB_ENV"

      - name: Run exact dynamic threshold ball-tree smoke
        shell: bash
        run: |
          set +e
          cd private-research
          mkdir -p results
          python experiments/223_dynamic_threshold_balltree_smoke.py             --model-bin "$MODEL_BIN"             > results/223_dynamic_threshold_balltree_stdout.txt 2>&1
          status=$?
          echo "$status" > results/223_runner_exit_code.txt
          exit 0

      - name: Upload short-lived result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp223-result
          path: |
            private-research/results/223_dynamic_threshold_balltree.json
            private-research/results/223_dynamic_threshold_balltree_stdout.txt
            private-research/results/223_runner_exit_code.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Reflect experiment exit status
        run: |
          code="$(cat private-research/results/223_runner_exit_code.txt)"
          test "$code" = "0"

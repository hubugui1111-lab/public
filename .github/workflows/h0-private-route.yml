# TEMPLATE ONLY. Copy temporarily to hubugui1111-lab/public/.github/workflows/,
# run it, import the small artifact into this private repository, then delete it.
name: h0-private-route-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-private-h0-route:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public scratch repository
        uses: actions/checkout@v4

      - name: Checkout private TDA repository read-only
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          ref: 1211861916adc7f468310882bd9356faf477862f
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false

      - name: Download and build pinned MP-SPDZ distribution
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -o /tmp/mp-spdz-0.4.3.tar.xz \
            https://github.com/data61/MP-SPDZ/releases/download/v0.4.3/mp-spdz-0.4.3.tar.xz
          echo '4b5f4f7a79f31365288fe4498ba2b70afc314c028696929c8d259ef50ab2e759  /tmp/mp-spdz-0.4.3.tar.xz' | sha256sum -c -
          tar -xJf /tmp/mp-spdz-0.4.3.tar.xz -C /tmp
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libboost-all-dev libgmp-dev libntl-dev libsodium-dev libssl-dev libtool >/dev/null
          SPDZ_DIR=/tmp/MP-SPDZ-0.4.3
          if [ ! -f "$SPDZ_DIR/compile.py" ]; then
            SPDZ_DIR=/tmp/mp-spdz-0.4.3
          fi
          test -f "$SPDZ_DIR/compile.py"
          if [ ! -x "$SPDZ_DIR/semi-party.x" ]; then
            printf '%s\n' 'USE_KOS = 1' >> "$SPDZ_DIR/CONFIG.mine"
            make -C "$SPDZ_DIR" -j2 semi-party.x
          fi
          printf '%s\n' "$SPDZ_DIR" > /tmp/spdz_dir.txt

      - name: Generate and run private H0 route smoke
        shell: bash
        run: |
          set +e
          set -o pipefail
          cd private-research
          mkdir -p results/225_private_h0_route_e2e
          python3 experiments/225_private_h0_route_e2e.py \
            --outdir results/225_private_h0_route_e2e \
            > results/225_private_h0_route_e2e/generator_stdout.txt 2>&1
          generator_status=$?
          if [ "$generator_status" -eq 0 ]; then
            REPO_ROOT="$GITHUB_WORKSPACE/private-research" \
            SPDZ="$(cat /tmp/spdz_dir.txt)" \
            bash scripts/run_225_private_h0_route_e2e.sh \
              "$GITHUB_WORKSPACE/private-research/results/225_private_h0_route_e2e" \
              > results/225_private_h0_route_e2e/runner_stdout.txt 2>&1
            run_status=$?
          else
            run_status="$generator_status"
          fi
          printf '%s\n' "$run_status" > results/225_private_h0_route_e2e/runner_exit_code.txt
          printf '%s\n' "$GITHUB_RUN_ID" > results/225_private_h0_route_e2e/public_run_id.txt
          printf '%s\n' '1211861916adc7f468310882bd9356faf477862f' > results/225_private_h0_route_e2e/private_head.txt
          exit 0

      - name: Upload short-lived private result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-h0-route-${{ github.run_id }}
          path: |
            private-research/results/225_private_h0_route_e2e/e2e_results.json
            private-research/results/225_private_h0_route_e2e/e2e_raw.txt
            private-research/results/225_private_h0_route_e2e/runner_stdout.txt
            private-research/results/225_private_h0_route_e2e/generator_stdout.txt
            private-research/results/225_private_h0_route_e2e/runner_exit_code.txt
            private-research/results/225_private_h0_route_e2e/public_run_id.txt
            private-research/results/225_private_h0_route_e2e/private_head.txt
          if-no-files-found: error
          retention-days: 1

      - name: Reflect experiment status
        shell: bash
        run: test "$(cat private-research/results/225_private_h0_route_e2e/runner_exit_code.txt)" = "0"

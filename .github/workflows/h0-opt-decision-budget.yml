name: h0-opt-decision-budget

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h0-opt-decision-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
      - name: Verify decision-budget theorem implementation
        run: |
          set -euo pipefail
          cd private-research
          python -m unittest discover -s tests -p 'test_h0_decision_budget.py' -v
          python -m tools.opt_decision_budget --k 680 --skip 0.9 --skip 0.8 --skip 0.75 --direct 0

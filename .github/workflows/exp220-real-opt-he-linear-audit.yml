name: Exp220A real OPT HE-linear audit

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/exp220-real-opt-he-linear-audit.yml'

permissions:
  contents: read

jobs:
  exp220a:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      TDA_COMMIT: 81c5d33075889ca5dae844f4e08533d3cb08a26a
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: |
          TASK_DIR="$RUNNER_TEMP/exp220a-$GITHUB_RUN_ID"
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"
          echo "HF_HOME=$TASK_DIR/hf" >> "$GITHUB_ENV"
          mkdir -p "$TASK_DIR"
      - name: Checkout private research
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          ref: ${{ env.TDA_COMMIT }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          persist-credentials: false
          fetch-depth: 1
      - name: Install Python
        run: |
          python3 -m venv "$TASK_DIR/venv"
          "$TASK_DIR/venv/bin/python" -m pip install --disable-pip-version-check torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          "$TASK_DIR/venv/bin/python" -m pip install --disable-pip-version-check numpy==2.1.3 transformers==4.56.2 tokenizers==0.22.0 huggingface-hub==0.34.4 datasets==3.6.0 pyarrow==21.0.0 safetensors==0.6.2
      - name: Run audit
        run: |
          "$TASK_DIR/venv/bin/python" private-research/experiments/220_real_opt_he_linear_audit.py --n 8 --batch-size 8 --out "$TASK_DIR/exp220a.json" | tee "$TASK_DIR/exp220a.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp220a-real-opt-he-linear-audit
          path: |
            ${{ env.TASK_DIR }}/exp220a.json
            ${{ env.TASK_DIR }}/exp220a.log
          if-no-files-found: error

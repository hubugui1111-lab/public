name: exp214-regression-and-release-probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp214-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private research repo
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          persist-credentials: false

      - name: Run exp214 regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy >/dev/null
          cd private-research
          python tests/test_exp214_global_greedy.py > results/214_global_greedy_regression_stdout.txt 2>&1

      - name: Probe old private release with compatibility secret
        id: probe_private
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.private }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oldrelease
          gh release download experiment-20260918             --repo hubugui1111-lab/transformer-h0-partial-activation-regions             --pattern UPLOAD_MANIFEST.json --dir /tmp/oldrelease
          test -s /tmp/oldrelease/UPLOAD_MANIFEST.json

      - name: Probe old private release with preferred secret
        id: probe_preferred
        if: steps.probe_private.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oldrelease2
          gh release download experiment-20260918             --repo hubugui1111-lab/transformer-h0-partial-activation-regions             --pattern UPLOAD_MANIFEST.json --dir /tmp/oldrelease2
          test -s /tmp/oldrelease2/UPLOAD_MANIFEST.json

      - name: Record probe result
        shell: bash
        run: |
          mkdir -p private-research/results
          {
            echo "{"
            echo "  \"exp214_regression\": \"PASS\","
            echo "  \"compat_secret_old_repo_access\": \"${{ steps.probe_private.outcome }}\","
            echo "  \"preferred_secret_old_repo_access\": \"${{ steps.probe_preferred.outcome }}\""
            echo "}"
          } > private-research/results/214_release_access_probe.json

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: exp214-probe-result
          path: |
            private-research/results/214_global_greedy_regression_stdout.txt
            private-research/results/214_release_access_probe.json
          retention-days: 1

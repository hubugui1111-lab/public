name: h0-tail-quotient-gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h0-tail-quotient-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact tail quotient
        run: |
          set -euo pipefail
          cd private-research
          python -m unittest discover -s tests -p 'test_h0_tail_quotient.py' -v
      - name: Measure real 8-bit canonical tail graph
        run: |
          set -euo pipefail
          cd private-research
          python -m tools.local_tail_quotient_gate \
            --cap 65536 --tail-bits 8 --out "$RUNNER_TEMP/tail.json"

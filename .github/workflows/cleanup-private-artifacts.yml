name: cleanup-private-artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-private-artifacts.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary research artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in 10554368790 10553324792 10555185525 10554805706; do
            gh api -X DELETE "/repos/hubugui1111-lab/public/actions/artifacts/$id" || true
          done

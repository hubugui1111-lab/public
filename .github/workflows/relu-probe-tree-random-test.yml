name: ReLU probe tree random heldout audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/relu-probe-tree-random-test.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      TDA_COMMIT: a02f2eb18323da659e392124a5e47c9dad801cea
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Initialize isolated scratch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TDA_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 2
          TASK_DIR="$RUNNER_TEMP/relu-probe-tree-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"
          echo "HF_HOME=$TASK_DIR/huggingface" >> "$GITHUB_ENV"
          umask 077
          mkdir -p "$TASK_DIR"
          printf '{"pass":false,"stage":"not_run"}\n' > "$TASK_DIR/summary.json"
      - name: Checkout private source read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hubugui1111-lab/tda-ppml-research
          ref: a02f2eb18323da659e392124a5e47c9dad801cea
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Install pinned CPU packages quietly
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-research rev-parse HEAD)" = "$TDA_COMMIT"
          if ! {
            python3 -m venv "$TASK_DIR/venv" &&
            "$TASK_DIR/venv/bin/python" -m pip install --disable-pip-version-check \
              torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu &&
            "$TASK_DIR/venv/bin/python" -m pip install --disable-pip-version-check \
              numpy==2.1.3 transformers==4.56.2 tokenizers==0.22.0 \
              huggingface-hub==0.34.4 datasets==3.6.0 pyarrow==21.0.0 safetensors==0.6.2 &&
            "$TASK_DIR/venv/bin/python" -m pip check
          } > "$TASK_DIR/dependencies.log" 2>&1; then
            printf '{"pass":false,"stage":"dependencies_failed"}\n' > "$TASK_DIR/summary.json"
            exit 1
          fi
      - name: Syntax check and run preregistered experiment
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=private-research/experiments/153b_relu_probe_tree_random_test.py
          "$TASK_DIR/venv/bin/python" -m py_compile "$SCRIPT"
          if ! "$TASK_DIR/venv/bin/python" "$SCRIPT" \
            --source-sha "$TDA_COMMIT" --n-fit 1024 --n-cal 1024 --n-test 512 \
            --min-leaf 32 --min-cal-occ 16 --layer 0 --max-depth 2 \
            --out "$TASK_DIR/summary.json" > "$TASK_DIR/driver.log" 2>&1; then
            printf '{"pass":false,"stage":"experiment_failed"}\n' > "$TASK_DIR/summary.json"
            exit 1
          fi
      - name: Upload aggregate result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: relu-probe-tree-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TASK_DIR }}/summary.json
          retention-days: 1
          if-no-files-found: error
      - name: Remove private scratch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "$TASK_DIR" in "$RUNNER_TEMP"/relu-probe-tree-*) ;; *) exit 2 ;; esac
          rm -rf -- "$TASK_DIR" "$GITHUB_WORKSPACE/private-research"

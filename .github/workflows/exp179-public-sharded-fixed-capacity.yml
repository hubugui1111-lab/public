name: exp179-public-sharded-fixed-capacity

on:
  push:
    paths:
      - '.github/workflows/exp179-public-sharded-fixed-capacity.yml'

permissions:
  contents: read
  actions: read

jobs:
  exp179:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      TDA_COMMIT: 7edbf51d8478d774a01356643f6568c9adb8242d
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Checkout private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hubugui1111-lab/tda-ppml-research
          ref: ${{ env.TDA_COMMIT }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          persist-credentials: false
          fetch-depth: 1

      - name: Download Exp170 frozen
        uses: actions/download-artifact@v4
        with:
          name: exp170-frozen-35886052689
          path: exp170/frozen
          github-token: ${{ github.token }}
          repository: hubugui1111-lab/public
          run-id: 35886052689

      - name: Download Exp170 SELECT
        uses: actions/download-artifact@v4
        with:
          name: exp170-select-35886052689
          path: exp170/select
          github-token: ${{ github.token }}
          repository: hubugui1111-lab/public
          run-id: 35886052689

      - name: Download Exp170 TEST
        uses: actions/download-artifact@v4
        with:
          name: exp170-test-35886052689
          path: exp170/test
          github-token: ${{ github.token }}
          repository: hubugui1111-lab/public
          run-id: 35886052689

      - name: Install
        run: |
          python3 -m venv venv
          venv/bin/pip install --disable-pip-version-check numpy==2.1.3

      - name: Run
        run: |
          set -euo pipefail
          mkdir -p result
          venv/bin/python private-research/experiments/179_public_sharded_fixed_capacity.py             --frozen exp170/frozen/frozen.pkl             --select-values exp170/select/select_values.npy             --test-values exp170/test/test_values.npy             --out result/summary.json | tee result/driver.log

      - name: Upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exp179-sharded-${{ github.run_id }}
          path: result/
          retention-days: 3
          if-no-files-found: error

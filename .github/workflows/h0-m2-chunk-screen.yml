name: h0-m2-chunk-screen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h0-m2-chunk-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
      - name: Verify chunk semantics
        run: |
          set -euo pipefail
          cd private-research
          python -m unittest discover -s tests -p 'test_h0_chunked_profile.py' -v
      - name: Targeted real-weight chunk screen
        run: |
          set -euo pipefail
          cd private-research
          python - <<'PY'
          from tools.h0_m2_preprocess.model import ModelSpec
          from tools.h0_m2_preprocess.chunked_profile import profile_chunked
          from tools.h0_m2_preprocess.schedules import axis_major_msb
          model=ModelSpec.load("results/local_real_model/exact_patch_model.json")
          sched=axis_major_msb(model.domain)
          for k in (1,2,4):
              r=profile_chunked(model,sched,chunk_bits=k,max_states=16384)
              print("TARGET_CHUNK",k,r["status"],round(r["elapsed_seconds"],6),
                    r["states"],r["build_calls"],r["memo_hits"],
                    r["max_partial_width"],r["deepest_bit_depth"],flush=True)
          PY

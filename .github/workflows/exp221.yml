name: exp221-capacity-selected-h0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp221.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exp221:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: d51e09690832ea5e78a83f81b137feffde936b3a
          path: private-research
          fetch-depth: 1
          persist-credentials: false

      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          python -m pip install numpy datasets "transformers>=4.45,<5" sentencepiece >/dev/null
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu >/dev/null

      - name: Recreate clean OPT sign pool
        shell: bash
        run: |
          set -euo pipefail
          cd private-research
          mkdir -p results
          python experiments/215_collect_clean_opt_sign_pool.py --n-build 8192 --n-eval 1024             > results/221_collect_sign_pool_stdout.txt 2>&1

      - name: Run capacity-selected H0 comparison
        shell: bash
        run: |
          set +e
          cd private-research
          python experiments/220_capacity_selected_h0.py --exact-seconds 20             > results/221_capacity_selected_h0_stdout.txt 2>&1
          status=$?
          echo "$status" > results/221_runner_exit_code.txt
          exit 0

      - name: Upload short-lived result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp221-result
          path: |
            private-research/results/220_capacity_selected_h0.json
            private-research/results/221_capacity_selected_h0_stdout.txt
            private-research/results/221_runner_exit_code.txt
            private-research/results/215_clean_sign_pool.json
            private-research/results/221_collect_sign_pool_stdout.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Reflect experiment exit status
        run: |
          code="$(cat private-research/results/221_runner_exit_code.txt)"
          test "$code" = "0"

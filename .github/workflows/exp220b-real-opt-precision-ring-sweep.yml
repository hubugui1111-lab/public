name: Exp220B real OPT precision ring sweep

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/exp220b-real-opt-precision-ring-sweep.yml'

permissions:
  contents: read

jobs:
  exp220b:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      TDA_COMMIT: 86bd9208e01dd011596d5059e7279bd218865f90
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: |
          TASK_DIR="$RUNNER_TEMP/exp220b-$GITHUB_RUN_ID"
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"
          echo "HF_HOME=$TASK_DIR/hf" >> "$GITHUB_ENV"
          mkdir -p "$TASK_DIR"
      - name: Checkout private research
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          ref: ${{ env.TDA_COMMIT }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          persist-credentials: false
          fetch-depth: 1
      - name: Install Python
        run: |
          python3 -m venv "$TASK_DIR/venv"
          "$TASK_DIR/venv/bin/python" -m pip install --disable-pip-version-check torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          "$TASK_DIR/venv/bin/python" -m pip install --disable-pip-version-check numpy==2.1.3 transformers==4.56.2 tokenizers==0.22.0 huggingface-hub==0.34.4 datasets==3.6.0 pyarrow==21.0.0 safetensors==0.6.2
      - name: Run precision sweep
        run: |
          "$TASK_DIR/venv/bin/python" private-research/experiments/220b_real_opt_precision_ring_sweep.py --n 32 --batch-size 8 --out "$TASK_DIR/exp220b.json" | tee "$TASK_DIR/exp220b.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp220b-real-opt-precision-ring-sweep
          path: |
            ${{ env.TASK_DIR }}/exp220b.json
            ${{ env.TASK_DIR }}/exp220b.log
          if-no-files-found: error

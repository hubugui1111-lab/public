name: h0-opt-safe-ellipsoid-coverage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h0-opt-safe-ellipsoid-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned model dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check \
            torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check \
            numpy==2.1.3 transformers==4.56.2 huggingface-hub==0.34.4 \
            safetensors==0.6.2
      - name: Measure strict anisotropic H0 ellipsoid coverage
        run: |
          set -euo pipefail
          cd private-research
          "$RUNNER_TEMP/venv/bin/python" -m tools.opt_h0_safe_ellipsoid_coverage \
            --out "$RUNNER_TEMP/ellipsoid.json"

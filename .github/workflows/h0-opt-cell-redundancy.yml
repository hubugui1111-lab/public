name: h0-opt-cell-redundancy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h0-opt-cell-redundancy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redundancy:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "transformers==4.56.2" "torch" "numpy" "scipy" "huggingface_hub"
      - name: Screen fixed-sign cell constraint redundancy
        run: |
          set -euo pipefail
          cd private-research
          python -m tools.opt_h0_cell_redundancy_screen             --budget 300 --budget 680 --h0-index 0 --per-group 8

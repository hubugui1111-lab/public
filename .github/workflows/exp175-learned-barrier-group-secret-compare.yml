name: exp175-learned-barrier-group-secret-compare
on:
  push:
    paths:
      - '.github/workflows/exp175-learned-barrier-group-secret-compare.yml'
permissions:
  contents: read
  actions: read
jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      TDA_COMMIT: b4e6e027b8ce3bca6eb29e082c3fdcc82f016420
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hubugui1111-lab/tda-ppml-research
          ref: ${{ env.TDA_COMMIT }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: exp170-frozen-35886052689
          path: exp170/frozen
          github-token: ${{ github.token }}
          repository: hubugui1111-lab/public
          run-id: 35886052689
      - uses: actions/download-artifact@v4
        with:
          name: exp170-build-35886052689
          path: exp170/build
          github-token: ${{ github.token }}
          repository: hubugui1111-lab/public
          run-id: 35886052689
      - uses: actions/download-artifact@v4
        with:
          name: exp170-select-35886052689
          path: exp170/select
          github-token: ${{ github.token }}
          repository: hubugui1111-lab/public
          run-id: 35886052689
      - uses: actions/download-artifact@v4
        with:
          name: exp170-test-35886052689
          path: exp170/test
          github-token: ${{ github.token }}
          repository: hubugui1111-lab/public
          run-id: 35886052689
      - run: |
          python3 -m venv venv
          venv/bin/pip install --disable-pip-version-check numpy==2.1.3
      - run: |
          mkdir -p result
          venv/bin/python private-research/experiments/175_learned_barrier_group_secret_compare.py             --frozen exp170/frozen/frozen.pkl             --build-values exp170/build/build_values.npy             --select-values exp170/select/select_values.npy             --test-values exp170/test/test_values.npy             --out result/summary.json | tee result/driver.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exp175-barrier-${{ github.run_id }}
          path: result/
          retention-days: 3
          if-no-files-found: error

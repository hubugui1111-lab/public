name: model-download-probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/model-download-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install lightweight HF client
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install "huggingface_hub>=0.25" >/dev/null
      - name: Download tiny model files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          repo="google/t5-efficient-tiny"
          files=["config.json","pytorch_model.bin","spiece.model","tokenizer_config.json","special_tokens_map.json"]
          for f in files:
              p=hf_hub_download(repo_id=repo, filename=f)
              import os
              print(f, os.path.getsize(p))
          PY

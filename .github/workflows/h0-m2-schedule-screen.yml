name: h0-m2-schedule-screen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h0-m2-schedule-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
      - name: Verify schedule semantics
        run: |
          set -euo pipefail
          cd private-research
          python -m unittest discover -s tests -p 'test_h0_schedules.py' -v
      - name: Screen public box-preserving schedules on real patch weights
        run: |
          set -euo pipefail
          cd private-research
          python -m tools.local_schedule_gate \
            --cap 65536 \
            --out "$RUNNER_TEMP/schedule_report.json"
          python - <<'PY'
          import json, os
          p=os.environ["RUNNER_TEMP"]+"/schedule_report.json"
          r=json.load(open(p))
          for x in r["results"]:
              print("SCHEDULE_RESULT", x["neurons"], x["schedule"], x["status"],
                    round(x["elapsed_seconds"],6), x["states"], x["memo_hits"],
                    x["max_partial_width"], x["deepest_state"])
          PY

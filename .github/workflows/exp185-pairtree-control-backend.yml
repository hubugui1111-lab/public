name: exp185-pairtree-control-backend

on:
  push:
    paths:
      - '.github/workflows/exp185-pairtree-control-backend.yml'

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      TDA_COMMIT: 1aab30d29dbf83c064be23b3a53e526cab1f0b97
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Init
        run: |
          set -euo pipefail
          TASK_DIR="$RUNNER_TEMP/exp185-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$TASK_DIR/result"

      - name: Checkout private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hubugui1111-lab/tda-ppml-research
          ref: ${{ env.TDA_COMMIT }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          persist-credentials: false
          fetch-depth: 1

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake libeigen3-dev libgmp-dev libssl-dev libomp-dev python3-venv

      - name: Fetch pinned BOLT
        run: |
          git clone --depth 1 https://github.com/cmu-cryptosystems/BOLT.git "$TASK_DIR/BOLT"
          git -C "$TASK_DIR/BOLT" fetch --depth 1 origin 6911b1c26cb0405793e7b5a3e9effe67f659bc49
          git -C "$TASK_DIR/BOLT" checkout --detach 6911b1c26cb0405793e7b5a3e9effe67f659bc49

      - name: Build
        run: |
          cmake -S private-research/experiments/244_shared_residual_h0 -B "$TASK_DIR/build"             -DBOLT_ROOT="$TASK_DIR/BOLT" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++
          cmake --build "$TASK_DIR/build" --target exp185_control_backend_benchmark --parallel 2

      - name: Run
        run: |
          python3 private-research/scripts/run_exp185_control_backend.py             --binary "$TASK_DIR/build/exp185_control_backend_benchmark"             --out-dir "$TASK_DIR/result" --reps 2 --warmup 1             | tee "$TASK_DIR/result/driver.log"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exp185-control-${{ github.run_id }}
          path: |
            ${{ env.TASK_DIR }}/result/summary.json
            ${{ env.TASK_DIR }}/result/driver.log
          retention-days: 3
          if-no-files-found: warn

name: exp153b-relu-sign-tree

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp153b-relu-sign-tree.yml'

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      TDA_COMMIT: a111f4a567b156155811eb50c714d47c40c3bef6
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      EXCLUDE_WINDOWS: '1,3,10,12,17,20,22,24,25,28,29,31,34,36,37,38,43,45,47,48,50,54,55,58,61,63,67,70,74,75,76,77,78,81,82,89,90,91,93,94,96,98,105,107,108,110,111,117,118,132,133,139,144,146,147,150,153,161,162,163,165,167,169,171,175,179,191,192,195,196,197,198,199,200,201,203,206,210,212,213,220,221,223,227,228,232,233,240,248,249,252,253,255,258,259,264,267,269,272,275,276,279,280,282,288,290,291,293,300,301,304,310,312,314,322,323,327,331,336,337,343,345,351,353,355,356,357,363,365,371,374,379,382,386,387,390,396,399,400,408,409,410,417,422,423,424,425,427,428,431,432,433,435,440,445,448,450,452,455,459,460,461,462,464,467,470,471,472,473,475,477,479,480,481,482,485,487,489,490,491,494,496,497,499,502,503,514,516,518,522,524,528,529,530,535,536,538,540,544,545,550,553,557,563,564,568,570,577,578,585,588,591,592,593,594,596,599,601,604,607,609,611,617,619,622,623,624,625,631,637,642,643,644,657,658,659,660,661,662,665,666,667,669,670,673,675,676,683,684,685,699,700,701,704,709,710,714,720,722,723,725,727,731,734,737,740,742,743,744,746,747,748,749,753,754,755,757,764,768,777,778,784,785,789,792,794,795,796,800,801,808,810,813,815,816,819,826,827,828,830,833,840,846,847,848,850,852,855,862,864,865,870,871,875,877,879,880,882,883,886,887,890,891,892,894,895,899,902,903,905,906,907,908,912,915,921,927,928,929,931,933,938,941,943,945,946,951,955,959,961,963,965,966,970,972,973,974,975,976,981,987,992,993,995,997,998,1003,1004,1006,1010,1015,1016,1020,1022,1025,1026,1032,1033,1036,1038,1039,1040,1041,1047,1050,1052,1054,1057,1060,1062,1063,1065,1070,1071,1076,1077,1079,1080,1093,1098,1106,1108'
    steps:
      - name: Initialize private scratch space
        shell: bash
        run: |
          set -euo pipefail
          TASK_DIR="$RUNNER_TEMP/exp153b-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          umask 077
          mkdir -p "$TASK_DIR"
          printf '{"schema_version":1,"pass":false,"stage":"not_run"}\n' > "$TASK_DIR/summary.json"
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"
          echo "HF_HOME=$TASK_DIR/huggingface" >> "$GITHUB_ENV"
          echo "HF_HUB_CACHE=$TASK_DIR/huggingface/hub" >> "$GITHUB_ENV"
          echo "MODEL_DIR=$TASK_DIR/opt-125m" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$TASK_DIR/pip-cache" >> "$GITHUB_ENV"
          echo "WIKITEXT_DIR=$TASK_DIR/huggingface/hub/datasets--Salesforce--wikitext/snapshots/b08601e04326c79dfdd32d625aee71d232d685c3/wikitext-2-raw-v1" >> "$GITHUB_ENV"
      - name: Checkout private experiment read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hubugui1111-lab/tda-ppml-research
          ref: a111f4a567b156155811eb50c714d47c40c3bef6
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Install pinned CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-research rev-parse HEAD)" = "$TDA_COMMIT"
          if ! {
            sudo apt-get update -qq &&
            sudo apt-get install -y -qq python3-venv &&
            python3 -m venv "$TASK_DIR/venv" &&
            "$TASK_DIR/venv/bin/python" -m pip install --disable-pip-version-check torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu &&
            "$TASK_DIR/venv/bin/python" -m pip install --disable-pip-version-check numpy==2.1.3 transformers==4.56.2 tokenizers==0.22.0 huggingface-hub==0.34.4 safetensors==0.6.2 sentencepiece==0.2.1 protobuf==5.29.5 pyarrow==19.0.1 &&
            "$TASK_DIR/venv/bin/python" -m pip check;
          } > "$TASK_DIR/dependencies.log" 2>&1; then
            printf '{"schema_version":1,"pass":false,"stage":"dependencies_failed"}\n' > "$TASK_DIR/summary.json"
            exit 1
          fi
      - name: Download pinned model and fresh test split
        shell: bash
        run: |
          set -euo pipefail
          if ! {
            "$TASK_DIR/venv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="facebook/opt-125m",
              revision="507a3991d874042a92e7581eb6e7cc7074b0c77e",
              local_dir=os.environ["MODEL_DIR"],
          )
          snapshot_download(
              repo_id="Salesforce/wikitext",
              repo_type="dataset",
              revision="b08601e04326c79dfdd32d625aee71d232d685c3",
              allow_patterns=["wikitext-2-raw-v1/*.parquet"],
              cache_dir=os.environ["HF_HUB_CACHE"],
          )
          model = Path(os.environ["MODEL_DIR"])
          for name in ("config.json", "vocab.json", "merges.txt"):
              if not (model / name).is_file():
                  raise FileNotFoundError(model / name)
          data = Path(os.environ["WIKITEXT_DIR"]) / "test-00000-of-00001.parquet"
          if not data.is_file():
              raise FileNotFoundError(data)
          print(f"pinned model/tokenizer/test parquet ready; bytes={data.stat().st_size}")
          PY
          } > "$TASK_DIR/download.log" 2>&1; then
            printf '{"schema_version":1,"pass":false,"stage":"download_failed"}\n' > "$TASK_DIR/summary.json"
            exit 1
          fi
      - name: Reserve fresh sample seed
        shell: bash
        run: |
          set -euo pipefail
          "$TASK_DIR/venv/bin/python" - <<'PY' >> "$GITHUB_ENV"
          import secrets
          print("EXPERIMENT_SEED=" + str(secrets.randbits(32)))
          PY
      - name: Run bounded fresh Exp153b screen
        shell: bash
        run: |
          set -euo pipefail
          if ! "$TASK_DIR/venv/bin/python" private-research/experiments/153b_relu_sign_tree_fresh.py \
            --model facebook/opt-125m --model-path "$MODEL_DIR" \
            --model-revision 507a3991d874042a92e7581eb6e7cc7074b0c77e \
            --dataset-revision b08601e04326c79dfdd32d625aee71d232d685c3 \
            --split test --seed "$EXPERIMENT_SEED" \
            --source-sha "$TDA_COMMIT" \
            --reservation "$TASK_DIR/reservation.json" \
            --out "$TASK_DIR/summary.json" \
            --calib-tokens 400000 --exclude-windows "$EXCLUDE_WINDOWS" \
            --n-fit 64 --n-cal 32 --n-test 32 \
            --min-leaves 4 --seeds 1 --cal-min-occ 4 --max-depth 4 --layers all \
            > "$TASK_DIR/run.log" 2>&1; then
            echo "Experiment failed; tail of private scratch traceback follows:" >&2
            tail -n 80 "$TASK_DIR/run.log" >&2 || true
            if [[ -f "$TASK_DIR/reservation.json" ]]; then
              echo "sample_reservation_written=true" >&2
            else
              echo "sample_reservation_written=false" >&2
            fi
            printf '{"schema_version":1,"pass":false,"stage":"experiment_failed"}\n' > "$TASK_DIR/summary.json"
            exit 1
          fi
          "$TASK_DIR/venv/bin/python" -m json.tool "$TASK_DIR/summary.json" > /dev/null
          "$TASK_DIR/venv/bin/python" - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["TASK_DIR"]) / "summary.json"
          d = json.loads(p.read_text())
          d["runner"] = {"repository": "hubugui1111-lab/public",
                         "run_id": os.environ["GITHUB_RUN_ID"],
                         "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                         "public_workflow_commit": os.environ["GITHUB_SHA"]}
          p.write_text(json.dumps(d, indent=2) + "\n")
          PY
      - name: Upload allowlisted summary and reservation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exp153b-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TASK_DIR }}/summary.json
            ${{ env.TASK_DIR }}/reservation.json
          if-no-files-found: warn
          retention-days: 1
      - name: Remove private scratch data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "$TASK_DIR" in "$RUNNER_TEMP"/exp153b-*) ;; *) exit 2 ;; esac
          rm -rf -- "$TASK_DIR" "$GITHUB_WORKSPACE/private-research"

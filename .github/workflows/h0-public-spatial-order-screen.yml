name: h0-public-spatial-order-screen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h0-public-spatial-order-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
      - name: Verify spatial schedules
        run: |
          set -euo pipefail
          cd private-research
          python -m unittest discover -s tests -p 'test_h0_spatial_schedules.py' -v
      - name: Screen real filter-0 public spatial orders
        run: |
          set -euo pipefail
          cd private-research
          python -m tools.local_spatial_schedule_gate --filter 0 --cap 1048576

# TEMPLATE ONLY: install temporarily in the public compute repository.
# Public artifacts contain only the fixed-schema aggregate summary.
name: h0-private-route-audit

on:
  workflow_dispatch:
    inputs:
      private_ref:
        description: Full audited private TDA commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      TDA_COMMIT: ${{ inputs.private_ref }}
    steps:
      - name: Validate immutable source reference
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TDA_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 2
          TASK_DIR="$RUNNER_TEMP/h0-mpspdz-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"
          umask 077
          mkdir -p "$TASK_DIR"
          printf '{"schema_version":1,"pass":false,"stage":"not_run"}\n' > "$TASK_DIR/summary.json"

      - name: Checkout private TDA source read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hubugui1111-lab/tda-ppml-research
          ref: ${{ inputs.private_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify checkout and install dependencies quietly
        shell: bash
        run: |
          set -euo pipefail
          if ! {
            test "$(git -C private-research rev-parse HEAD)" = "$TDA_COMMIT" &&
            sudo apt-get update -qq &&
            sudo apt-get install -y -qq build-essential clang libboost-all-dev libgmp-dev libntl-dev libsodium-dev libssl-dev libtool python3-venv &&
            python3 -m venv "$TASK_DIR/venv" &&
            "$TASK_DIR/venv/bin/python" -m pip install --disable-pip-version-check numpy==2.1.3 pytest==8.3.5
          } > "$TASK_DIR/dependencies.log" 2>&1; then
            printf '{"schema_version":1,"pass":false,"stage":"dependencies_failed"}\n' > "$TASK_DIR/summary.json"
            exit 1
          fi

      - name: Download and build verified MP-SPDZ distribution quietly
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if ! {
            curl --fail --location --retry 3 --connect-timeout 30 --max-time 240 \
              -o "$TASK_DIR/mp-spdz-0.4.3.tar.xz" \
              https://github.com/data61/MP-SPDZ/releases/download/v0.4.3/mp-spdz-0.4.3.tar.xz &&
            printf '%s  %s\n' 4b5f4f7a79f31365288fe4498ba2b70afc314c028696929c8d259ef50ab2e759 "$TASK_DIR/mp-spdz-0.4.3.tar.xz" | sha256sum -c - &&
            mkdir -p "$TASK_DIR/spdz" &&
            tar -xJf "$TASK_DIR/mp-spdz-0.4.3.tar.xz" --strip-components=1 -C "$TASK_DIR/spdz" &&
            test -f "$TASK_DIR/spdz/compile.py"
          } > "$TASK_DIR/fetch.log" 2>&1; then
            printf '{"schema_version":1,"pass":false,"stage":"fetch_failed"}\n' > "$TASK_DIR/summary.json"
            exit 1
          fi
          if ! {
            if [ ! -x "$TASK_DIR/spdz/semi-party.x" ]; then
              printf '%s\n' 'USE_KOS = 1' >> "$TASK_DIR/spdz/CONFIG.mine" &&
              timeout --signal=TERM --kill-after=10s 1200s make -C "$TASK_DIR/spdz" -j2 semi-party.x
            fi &&
            test -x "$TASK_DIR/spdz/semi-party.x"
          } > "$TASK_DIR/build.log" 2>&1; then
            printf '{"schema_version":1,"pass":false,"stage":"build_failed"}\n' > "$TASK_DIR/summary.json"
            exit 1
          fi

      - name: Run geometry, clear references, and real two-party checks quietly
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          "$TASK_DIR/venv/bin/python" private-research/scripts/run_h0_mpspdz_audit.py \
            --spdz "$TASK_DIR/spdz" \
            --report "$TASK_DIR/summary.json" \
            --source-sha "$TDA_COMMIT" \
            --timeout 1500 \
            > "$TASK_DIR/driver.log" 2>&1

      # Never add raw logs, source JSON, inputs, or outputs to this upload.
      - name: Upload short-lived sanitized audit summary
        if: always() && env.TASK_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h0-mpspdz-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TASK_DIR }}/summary.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove private scratch data from runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Verify canonical paths before recursive removal; reject symlink escape.
          expected_task="$(realpath -m -- "$RUNNER_TEMP/h0-mpspdz-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")"
          runner_root="$(realpath -m -- "$RUNNER_TEMP")"
          case "$expected_task" in "$runner_root"/h0-mpspdz-*) ;; *) exit 2 ;; esac
          if [ -n "${TASK_DIR:-}" ]; then
            test "$(realpath -m -- "$TASK_DIR")" = "$expected_task"
            rm -rf -- "$expected_task"
          fi
          workspace="$(realpath -m -- "$GITHUB_WORKSPACE")"
          private_checkout="$(realpath -m -- "$GITHUB_WORKSPACE/private-research")"
          test "$private_checkout" = "$workspace/private-research"
          rm -rf -- "$private_checkout"

# Controller: inspect aggregate summary/status, then delete artifact AND run logs
# and remove the temporary workflow. Scratch summaries are not paper data.

name: Exp201 additive 5-round secret shuffle

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'experiments/exp201_additive_secret_shuffle.cpp'
      - '.github/workflows/exp201-additive-secret-shuffle.yml'

permissions:
  contents: read

jobs:
  exp201:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: mkdir -p "$GITHUB_WORKSPACE/results"

      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y libmpfr-dev libgmp-dev cmake g++ make git

      - name: Build and install SEAL 4.1.2
        run: |
          git clone --depth 1 --branch v4.1.2 https://github.com/microsoft/SEAL.git /tmp/SEAL
          cmake -S /tmp/SEAL -B /tmp/SEAL/build -DSEAL_BUILD_TESTS=OFF -DSEAL_BUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/SEAL/build -j2
          sudo cmake --install /tmp/SEAL/build

      - name: Clone EzPC SCI
        run: git clone --depth 1 https://github.com/mpc-msri/EzPC.git /tmp/EzPC

      - name: Install Exp201
        run: |
          cp experiments/exp201_additive_secret_shuffle.cpp /tmp/EzPC/SCI/tests/
          printf '\n' >> /tmp/EzPC/SCI/tests/CMakeLists.txt
          cat >> /tmp/EzPC/SCI/tests/CMakeLists.txt <<'EOF'
          find_package(SEAL 4.1 REQUIRED)
          add_executable(exp201-additive-shuffle exp201_additive_secret_shuffle.cpp)
          target_link_libraries(exp201-additive-shuffle SCI-OT SEAL::seal)
          EOF

      - name: Initialize and patch legacy SEAL
        run: |
          git -C /tmp/EzPC submodule update --init --depth 1 SCI/extern/SEAL
          python3 - <<'PY'
          from pathlib import Path
          p=Path("/tmp/EzPC/SCI/extern/SEAL/native/src/seal/util/locks.h")
          s=p.read_text()
          if "#include <mutex>" not in s:
              s=s.replace("#pragma once","#pragma once\n#include <mutex>")
              p.write_text(s)
          PY

      - name: Configure
        working-directory: /tmp/EzPC/SCI
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_NETWORKS=OFF

      - name: Build
        working-directory: /tmp/EzPC/SCI
        run: cmake --build build --target exp201-additive-shuffle -j2

      - name: Run two-party Exp201
        working-directory: /tmp/EzPC/SCI
        shell: bash
        run: |
          set -uo pipefail
          ./build/bin/exp201-additive-shuffle r=1 p=20310 > "$GITHUB_WORKSPACE/results/exp201_P1.log" 2>&1 &
          P1=$!
          sleep 0.3
          ./build/bin/exp201-additive-shuffle r=2 p=20310 ip=127.0.0.1 > "$GITHUB_WORKSPACE/results/exp201_P2.log" 2>&1
          C2=$?
          wait "$P1"; C1=$?
          cat "$GITHUB_WORKSPACE/results/exp201_P1.log"
          cat "$GITHUB_WORKSPACE/results/exp201_P2.log"
          if [ "$C1" -ne 0 ] || [ "$C2" -ne 0 ]; then exit 3; fi

      - name: Parse
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib
          rows=[]
          for p in sorted(pathlib.Path("results").glob("exp201_P*.log")):
              for line in p.read_text().splitlines():
                  if line.startswith("EXP201_RESULT "):
                      d={"source":p.name}
                      for tok in line[len("EXP201_RESULT "):].split():
                          k,v=tok.split("=",1)
                          try:d[k]=float(v) if "." in v else int(v)
                          except:d[k]=v
                      rows.append(d)
          report={"experiment":"Exp201 additive 5-round secret shuffle","rows":rows}
          pathlib.Path("results/exp201_additive_secret_shuffle.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          if len(rows)!=2: raise SystemExit(f"expected 2 rows, got {len(rows)}")
          if any(r.get("mismatches",1) for r in rows): raise SystemExit("mismatch")
          if any(r.get("opened_weight")!=320 for r in rows): raise SystemExit("weight")
          if any(r.get("movement_conceptual_rounds")!=5 for r in rows): raise SystemExit("round model")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp201-additive-secret-shuffle
          path: results/exp201_*
          if-no-files-found: error

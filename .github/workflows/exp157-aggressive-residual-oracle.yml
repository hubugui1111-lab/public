name: exp157-aggressive-residual-oracle

on:
  push:
    paths:
      - '.github/workflows/exp157-aggressive-residual-oracle.yml'

permissions:
  contents: read

jobs:
  exp157:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      TDA_COMMIT: 6c6892faa83e9febb180178f2a631be5b25dd650
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Init
        run: |
          set -euo pipefail
          TASK_DIR="$RUNNER_TEMP/exp157-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"
          echo "HF_HOME=$TASK_DIR/huggingface" >> "$GITHUB_ENV"
          mkdir -p "$TASK_DIR"

      - name: Checkout private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hubugui1111-lab/tda-ppml-research
          ref: ${{ env.TDA_COMMIT }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          persist-credentials: false
          fetch-depth: 1
          submodules: false

      - name: Install
        run: |
          set -euo pipefail
          python3 -m venv "$TASK_DIR/venv"
          "$TASK_DIR/venv/bin/python" -m pip install --disable-pip-version-check             torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          "$TASK_DIR/venv/bin/python" -m pip install --disable-pip-version-check             numpy==2.1.3 transformers==4.56.2 tokenizers==0.22.0             huggingface-hub==0.34.4 datasets==3.6.0 pyarrow==21.0.0 safetensors==0.6.2
          "$TASK_DIR/venv/bin/python" -m pip check

      - name: Run
        run: |
          set -euo pipefail
          SCRIPT=private-research/experiments/157_aggressive_residual_template_oracle.py
          "$TASK_DIR/venv/bin/python" -m py_compile "$SCRIPT"
          "$TASK_DIR/venv/bin/python" "$SCRIPT"             --source-sha "$TDA_COMMIT" --layer 0             --n-fit 1024 --n-cal 32 --n-build 2048 --n-select 1024 --n-test 512             --min-leaf 32             --out "$TASK_DIR/summary.json" | tee "$TASK_DIR/driver.log"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exp157-aggressive-residual-oracle-${{ github.run_id }}
          path: |
            ${{ env.TASK_DIR }}/summary.json
            ${{ env.TASK_DIR }}/driver.log
          retention-days: 1
          if-no-files-found: error

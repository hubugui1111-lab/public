name: h0-opt-prefix-overlap-audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h0-opt-prefix-overlap-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
      - name: Install tokenizer dependency
        run: |
          python -m pip install --upgrade pip
          pip install "transformers==4.56.2" "huggingface_hub"
      - name: Audit causal-prefix overlap
        run: |
          set -euo pipefail
          cd private-research
          python -m tools.opt_h0_prefix_overlap_audit

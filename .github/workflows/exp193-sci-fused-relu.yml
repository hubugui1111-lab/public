name: Exp193 SCI fused ReLU

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'experiments/exp193_sci_relu_ring.cpp'
      - '.github/workflows/exp193-sci-fused-relu.yml'

permissions:
  contents: read

jobs:
  exp193:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: mkdir -p "$GITHUB_WORKSPACE/results"
      - name: Clone EzPC SCI
        run: git clone --depth 1 https://github.com/mpc-msri/EzPC.git /tmp/EzPC
      - name: Patch legacy SEAL GCC compatibility
        run: |
          sed -i '1i #include <mutex>' /tmp/EzPC/SCI/extern/SEAL/native/src/seal/util/locks.h

      - name: Install Exp193 source
        run: |
          cp experiments/exp193_sci_relu_ring.cpp /tmp/EzPC/SCI/tests/exp193_sci_relu_ring.cpp
          printf '\nadd_executable(exp193-sci-relu exp193_sci_relu_ring.cpp)\ntarget_link_libraries(exp193-sci-relu SCI-OT)\n' >> /tmp/EzPC/SCI/tests/CMakeLists.txt
      - name: Build SCI Exp193
        working-directory: /tmp/EzPC/SCI
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_NETWORKS=OFF
          cmake --build build --target exp193-sci-relu -j2
      - name: Run two-party sweep
        working-directory: /tmp/EzPC/SCI
        shell: bash
        run: |
          set -euo pipefail
          run_case() {
            N="$1"; RADIX="$2"; PORT="$3"; NAME="N${N}_R${RADIX}"
            ./build/bin/exp193-sci-relu r=1 p="$PORT" N="$N" b="$RADIX" > "$GITHUB_WORKSPACE/results/exp193_${NAME}_P1.log" 2>&1 &
            P1=$!
            sleep 0.2
            ./build/bin/exp193-sci-relu r=2 p="$PORT" ip=127.0.0.1 N="$N" b="$RADIX" > "$GITHUB_WORKSPACE/results/exp193_${NAME}_P2.log" 2>&1
            wait "$P1"
            cat "$GITHUB_WORKSPACE/results/exp193_${NAME}_P1.log"
            cat "$GITHUB_WORKSPACE/results/exp193_${NAME}_P2.log"
          }
          run_case 320 4 20100
          run_case 320 8 20101
          run_case 640 4 20102
          run_case 640 8 20103
      - name: Parse
        run: |
          python3 - <<'PY'
          import json,pathlib
          rows=[]
          for p in sorted(pathlib.Path("results").glob("exp193_*_P*.log")):
              for line in p.read_text().splitlines():
                  if not line.startswith("EXP193_RESULT "): continue
                  row={"source":p.name}
                  for tok in line[len("EXP193_RESULT "):].split():
                      k,v=tok.split("=",1)
                      try: row[k]=float(v) if "." in v else int(v)
                      except ValueError: row[k]=v
                  rows.append(row)
          if len(rows)!=8: raise SystemExit(f"expected 8 rows, got {len(rows)}")
          cases={}
          for r in rows: cases.setdefault((r["N"],r["radix"]),[]).append(r)
          summary=[]
          for (N,radix),rs in sorted(cases.items()):
              summary.append({
                "N":N,"radix":radix,
                "max_rounds":max(x["rounds"] for x in rs),
                "max_bytes":max(x["bytes"] for x in rs),
                "max_ms":max(x["ms"] for x in rs),
                "mismatches":sum(x["mismatches"] for x in rs),
              })
          report={"experiment":"Exp193 SCI fused ReLURingProtocol 48-bit","baseline_fixop_relu_rounds":5,"summary":summary,"rows":rows}
          pathlib.Path("results/exp193_sci_fused_relu.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exp193-sci-fused-relu
          path: results/exp193_*
          if-no-files-found: error

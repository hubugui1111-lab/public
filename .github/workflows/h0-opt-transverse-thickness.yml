name: h0-opt-transverse-thickness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h0-opt-transverse-thickness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "transformers==4.56.2" "torch" "numpy" "scipy" "huggingface_hub"
      - name: Measure transverse cell conditioning
        run: |
          set -euo pipefail
          cd private-research
          python -m tools.opt_transverse_thickness --k 680 --family distance --trial 0

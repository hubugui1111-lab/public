name: exp215-opt-multimask-smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp215-opt-multimask.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exp215:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          persist-credentials: false

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          python -m pip install numpy datasets "transformers>=4.45,<5" >/dev/null
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu >/dev/null

      - name: Run exp214 regression
        shell: bash
        run: |
          set -euo pipefail
          cd private-research
          mkdir -p results
          python tests/test_exp214_global_greedy.py > results/215_exp214_regression_stdout.txt 2>&1

      - name: Collect real OPT sign pool
        shell: bash
        run: |
          set -euo pipefail
          cd private-research
          python experiments/215_collect_clean_opt_sign_pool.py             --layer 6             --n-build 8192             --n-eval 1024             --build-stream-tokens 32768             --eval-stream-tokens 8192             --out results/215_clean_sign_pool.json             > results/215_clean_sign_pool_stdout.txt 2>&1

      - name: Run multi-mask H0 smoke
        shell: bash
        run: |
          set +e
          cd private-research
          python experiments/214_multimask_h0_library.py             --layer 6             --n-build 8192             --n-eval 1024             --budgets 307,461             --h0-candidates 1024             --select-states 1024             --lib-select-fraction 0.25             --max-h0 32             --masks-per-h0 128             --seed-trials 8             --h0-mask-pool overlap             --out results/215_multimask_opt_smoke.json             > results/215_multimask_opt_smoke_stdout.txt 2>&1
          status=$?
          echo "$status" > results/215_runner_exit_code.txt
          exit 0

      - name: Upload short-lived result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp215-result
          path: |
            private-research/results/215_exp214_regression_stdout.txt
            private-research/results/215_clean_sign_pool.json
            private-research/results/215_clean_sign_pool_stdout.txt
            private-research/results/215_multimask_opt_smoke.json
            private-research/results/215_multimask_opt_smoke_stdout.txt
            private-research/results/215_runner_exit_code.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Reflect experiment exit status
        shell: bash
        run: |
          code="$(cat private-research/results/215_runner_exit_code.txt)"
          test "$code" = "0"

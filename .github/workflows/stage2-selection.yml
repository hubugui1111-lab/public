# Ephemeral launcher only; private protocol code is never copied into this repo.
name: stage2-selection
on:
  workflow_dispatch:
    inputs:
      private_ref:
        description: Full immutable private source SHA
        required: true
        type: string
      runner_image:
        description: Standard image for paired environment checks
        required: true
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - ubuntu-22.04
permissions:
  contents: read
jobs:
  selection:
    runs-on: ${{ inputs.runner_image == 'ubuntu-22.04' && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    env:
      TDA_COMMIT: ${{ inputs.private_ref }}
    steps:
      - name: Initialize bounded scratch job
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TDA_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 2
          TASK_DIR="$RUNNER_TEMP/stage2-selection-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "TASK_DIR=$TASK_DIR" >> "$GITHUB_ENV"
          umask 077
          mkdir -p "$TASK_DIR"
          printf '{"schema_version":1,"pass":false,"stage":"not_run"}\n' > "$TASK_DIR/summary.json"
      - name: Checkout private source read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hubugui1111-lab/tda-ppml-research
          ref: ${{ inputs.private_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Install dependencies quietly
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-research rev-parse HEAD)" = "$TDA_COMMIT"
          if ! {
            sudo apt-get update -qq &&
            sudo apt-get install -y -qq clang cmake libeigen3-dev libgmp-dev libssl-dev libomp-dev;
          } > "$TASK_DIR/dependencies.log" 2>&1; then
            printf '{"schema_version":1,"pass":false,"stage":"dependencies_failed"}\n' > "$TASK_DIR/summary.json"
            exit 1
          fi
      - name: Fetch pinned public dependency quietly
        shell: bash
        run: |
          set -euo pipefail
          if ! {
            git clone --depth 1 https://github.com/cmu-cryptosystems/BOLT.git "$TASK_DIR/BOLT" &&
            git -C "$TASK_DIR/BOLT" fetch --depth 1 origin 6911b1c26cb0405793e7b5a3e9effe67f659bc49 &&
            git -C "$TASK_DIR/BOLT" checkout --detach 6911b1c26cb0405793e7b5a3e9effe67f659bc49 &&
            test "$(git -C "$TASK_DIR/BOLT" rev-parse HEAD)" = 6911b1c26cb0405793e7b5a3e9effe67f659bc49;
          } > "$TASK_DIR/fetch.log" 2>&1; then
            printf '{"schema_version":1,"pass":false,"stage":"fetch_failed"}\n' > "$TASK_DIR/summary.json"
            exit 1
          fi
      - name: Build shared components once
        shell: bash
        run: |
          set -euo pipefail
          if ! {
            cmake -S private-research/experiments/233_stage2_private_selection -B "$TASK_DIR/build" \
              -DBOLT_ROOT="$TASK_DIR/BOLT" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ &&
            cmake --build "$TASK_DIR/build" --parallel 2;
          } > "$TASK_DIR/build.log" 2>&1; then
            python3 private-research/scripts/summarize_h0_build_failure.py "$TASK_DIR/build.log" "$TASK_DIR/summary.json"
            exit 1
          fi
      - name: Validate and compare small secret selection only
        shell: bash
        run: |
          set -euo pipefail
          python3 private-research/scripts/run_stage2_private_selection.py --build "$TASK_DIR/build" \
            --source-sha "$TDA_COMMIT" --report "$TASK_DIR/summary.json" > "$TASK_DIR/driver.log" 2>&1
      - name: Upload allowlisted scratch summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage2-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TASK_DIR }}/summary.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove private scratch data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "$TASK_DIR" in "$RUNNER_TEMP"/stage2-selection-*) ;; *) exit 2 ;; esac
          rm -rf -- "$TASK_DIR" "$GITHUB_WORKSPACE/private-research"

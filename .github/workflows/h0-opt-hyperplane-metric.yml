name: h0-opt-hyperplane-metric

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h0-opt-hyperplane-metric.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metric:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private research repo READ ONLY
        uses: actions/checkout@v4
        with:
          repository: hubugui1111-lab/tda-ppml-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-research
          fetch-depth: 1
          persist-credentials: false
      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "transformers==4.56.2" "torch" "numpy" "huggingface_hub"
      - name: Measure hyperplane-induced safe ellipsoids
        run: |
          set -euo pipefail
          cd private-research
          python -m tools.opt_h0_hyperplane_metric_frontier             --budget 300 --budget 680 --budget 1024             --ridge-ratio 1e-6 --ridge-ratio 1e-4 --ridge-ratio 1e-2 --ridge-ratio 1
